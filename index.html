<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ma trận Strassen Web</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        pre {
            max-height: 400px;
            overflow-y: auto;
            background: #f0f0f0;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Mô phỏng Nhân Ma trận Strassen/Winograd</h1>

    <label>Nhập cấp số k (n=2^k, 1-12): </label>
    <input type="number" id="inputK" min="1" max="12" value="4">
    <button id="runBtn">Chạy mô phỏng</button>

<pre id="output"></pre>
    <canvas id="chart" width="600" height="400"></canvas>

    <script src="matran.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded",()=>{
            const outputEl=document.getElementById("output");
        const ctx=document.getElementById("chart").getContext("2d");
        let chart=null;

        Module.onRuntimeInitialized=()=>{
            let results=[];

        Module.print=(text)=>{
            outputEl.textContent+=text+"\n";

        if(text.includes(":") && !text.includes("Ma tran")){
            let parts=text.split(":");
            if(parts.length==2){
                let value=parseFloat(parts[1]);
                if(!isNaN(value)) results.push(value);
            }
        }

        if(results.length==3){
            if(chart) chart.destroy();
            chart=new Chart(ctx,{
                type:'bar',
                data:{
                    labels:['Nhân thường','Strassen','Strassen Winograd'],
                    datasets:[{
                        label:'Thời gian (giây)',
                        data:results,
                        backgroundColor:['#f44336','#2196f3','#4caf50']
                    }]
                },
                options:{responsive:true,scales:{y:{beginAtZero:true}}}
            });
            results=[];
        }
        };

        document.getElementById("runBtn").onclick=()=>{
            outputEl.textContent="Đang tính toán...\n";
        const k=parseInt(document.getElementById("inputK").value);
        if(isNaN(k)||k<1||k>12){ alert("Vui lòng nhập k hợp lệ (1-12)"); return; }
        results=[];
        Module.ccall('runSimulation','void',['number'],[k]);
        };
        };
        });
    </script>
</body>
</html>
